name: Build and deploy Python app to Azure Web App - SpotifyHybridRecomandationSystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write        # ✅ Needed for Azure OIDC login
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.git/
            !.github/
            !__pycache__/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_112228663629478BBA9F3911EE34948B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56F4E51058484433B43A93AC5F2F7967 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68749AD24C0644F19D2680A4365158E4 }}
          auth-type: 'id-token'   # ✅ Required for OIDC login

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SpotifyHybridRecomandationSystem'
          package: .
