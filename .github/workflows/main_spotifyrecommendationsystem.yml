# Docs: https://github.com/Azure/webapps-deploy
# More info: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - SpotifyRecommendationSystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Compress the project into a zip (for deployment)
      - name: Prepare artifact
        run: |
          zip -r python-app.zip . -x "antenv/*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2623302516D7404B93F1FA634ACB0DEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F74052F9300642ABA95BE814A7F78257 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_961A453A1A7F4B3A915D70936BFEC9E6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'SpotifyRecommendationSystem'  # must match Azure Web App name exactly
          slot-name: 'Production'
          package: 'python-app.zip'  # ✅ required!
